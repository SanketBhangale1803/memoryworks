[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmemory-sdk"
version = "0.1.0"
description = "Python SDK and CLI for MemoryWorks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "MemoryWorks"}]
license = "MIT"
dependencies = ["httpx>=0.27,<1"]
keywords = ["agents", "memory", "context", "knowledge-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.scripts]
orgmemory = "orgmemory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orgmemory = ["py.typed"]
