name: MemoryWorks briefing
description: >-
  Serve a cited MemoryWorks briefing for a pull request through POST /api/briefings
  and post it as a "MemoryWorks briefing" Check plus one sticky PR comment.
  A briefing is advice, not authorization: this action never approves or merges.
author: MemoryWorks
branding:
  icon: book-open
  color: blue

inputs:
  api-key:
    description: >-
      Workspace API key (store it as a repository or organization secret). Its team
      scope decides which memories can be cited; the check and comment are visible
      to everyone who can read this repository.
    required: true
  api-url:
    description: MemoryWorks API URL.
    required: false
    default: https://api.memoryworks.app
  app-url:
    description: MemoryWorks web app URL, used for memory links.
    required: false
    default: https://memoryworks.app
  service:
    description: >-
      Service this repository changes. Without it the briefing cannot pull the
      service's constraints and incident history, and the check says so.
    required: false
    default: ""
  project-id:
    description: Limit the briefing to one MemoryWorks project.
    required: false
    default: ""
  approval-conclusion:
    description: >-
      Check conclusion when the briefing says a person has to decide:
      action_required (blocks a required check) or neutral.
    required: false
    default: action_required
  show-memory-text:
    description: Include memory subjects in the check and comment ("true"/"false").
    required: false
    default: "false"
  comment:
    description: Post or update the sticky PR comment ("true"/"false").
    required: false
    default: "true"
  github-token:
    description: Token with checks:write and pull-requests:write.
    required: false
    default: ${{ github.token }}

outputs:
  state:
    description: unavailable | requires_approval | no_memory | proceed_with_context | proceed
    value: ${{ steps.brief.outputs.state }}
  conclusion:
    description: The conclusion posted on the check.
    value: ${{ steps.brief.outputs.conclusion }}
  briefing-id:
    description: The briefing_id to report an outcome against.
    value: ${{ steps.brief.outputs.briefing_id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the MemoryWorks SDK from this action's checkout
      shell: bash
      run: python -m pip install --quiet "${GITHUB_ACTION_PATH}/../../python_sdk"
    - id: brief
      name: Serve the briefing and post the check
      shell: bash
      env:
        # Inputs travel as environment variables, never interpolated into the
        # script, so pull request text cannot become shell.
        MEMORYWORKS_API_KEY: ${{ inputs.api-key }}
        MEMORYWORKS_API_URL: ${{ inputs.api-url }}
        MEMORYWORKS_APP_URL: ${{ inputs.app-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MW_SERVICE: ${{ inputs.service }}
        MW_PROJECT_ID: ${{ inputs.project-id }}
        MW_APPROVAL_CONCLUSION: ${{ inputs.approval-conclusion }}
        MW_SHOW_MEMORY_TEXT: ${{ inputs.show-memory-text }}
        MW_COMMENT: ${{ inputs.comment }}
      run: |
        args=(github-check --json
              --service "$MW_SERVICE"
              --project-id "$MW_PROJECT_ID"
              --approval-conclusion "$MW_APPROVAL_CONCLUSION")
        [ "$MW_SHOW_MEMORY_TEXT" = "true" ] && args+=(--show-memory-text)
        [ "$MW_COMMENT" = "true" ] || args+=(--no-comment)
        orgmemory "${args[@]}" > "$RUNNER_TEMP/memoryworks-check.json"
        python - <<'PY'
        import json, os
        result = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "memoryworks-check.json")))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"state={result['state']}\n")
            out.write(f"conclusion={result['conclusion']}\n")
            out.write(f"briefing_id={result['briefing_id']}\n")
        print(f"MemoryWorks briefing: {result['state']} ({result['conclusion']}), "
              f"briefing {result['briefing_id'] or 'not recorded'}"
              + (" — reused for this SHA" if result["reused"] else ""))
        PY
